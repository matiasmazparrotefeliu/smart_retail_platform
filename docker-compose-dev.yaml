services:
  fastapi:
    build:
      context: ./backend
    image: backend-smart-retail-platform:latest
    container_name: backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s