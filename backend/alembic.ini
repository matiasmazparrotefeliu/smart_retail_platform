# Configuración de Alembic para Smart Retail Platform.
# La URL de la base de datos NO se define aquí: `migrations/env.py` la lee
# desde `settings.database_url` (variables de entorno / `<raíz>/.env`).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
version_path_separator = os

# Formato de los nombres de archivo de las migraciones generadas
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
